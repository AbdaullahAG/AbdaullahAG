<svg width="820" height="130" viewBox="0 0 820 130" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur">
        <animate attributeName="stdDeviation" values="3;8;3" dur="2.6s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="-100 0" to="1000 0" dur="3.2s" repeatCount="indefinite"/>
    </linearGradient>

    <clipPath id="textClip">
      <text x="50%" y="80" text-anchor="middle"
        font-family="'Fira Code','Courier New',monospace" font-weight="700"
        font-size="46" letter-spacing="3">ABDALLAH ABUGHALLOUS</text>
    </clipPath>
  </defs>

  <text x="50%" y="80" text-anchor="middle"
    font-family="'Fira Code','Courier New',monospace" font-weight="700"
    font-size="46" letter-spacing="3" fill="#00f2ff" filter="url(#glow)">ABDALLAH ABUGHALLOUS</text>

  <rect x="0" y="0" width="820" height="130" fill="url(#shine)" clip-path="url(#textClip)"/>
</svg>
